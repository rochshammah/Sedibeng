<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10292d" />
    <title>You're offline · Sedibeng</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f6f1;
        color: #10292d;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 480px);
        padding: 40px;
        border: 1px solid #e5e8e3;
        border-radius: 28px;
        background: #fff;
        box-shadow: 0 24px 70px #10292d12;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        margin-bottom: 30px;
        border-radius: 17px;
        background: #10292d;
      }
      .mark svg { width: 31px; height: 31px; }
      p {
        margin: 0 0 12px;
        color: #607477;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 7vw, 2.5rem); letter-spacing: -0.05em; }
      .copy { margin: 0 0 28px; color: #657477; line-height: 1.65; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 20px;
        border-radius: 14px;
        background: #137b73;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #6bc9b9; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M4 12c5-5 10-5 15 0s7 5 9 3M4 20c5-5 10-5 15 0s7 5 9 3" stroke="#87D7C8" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <p>Sedibeng go iwa ka tsela</p>
      <h1>You're offline</h1>
      <div class="copy">The public app shell is available, but this page needs an internet connection to load the latest information. Private account data is never stored offline.</div>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
